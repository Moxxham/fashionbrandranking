<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Menswear Index</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; width: 300px; font: 13px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #161514; background: #f4f2ed; }
      header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #dcd7cd; }
      header strong { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
      section { padding: 12px 14px; border-bottom: 1px solid #dcd7cd; }
      h2 { margin: 0 0 6px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #5c5750; }
      .status { color: #3a3834; }
      .err { color: #722426; margin-top: 4px; font-size: 12px; }
      label { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
      input[type='text'] { box-sizing: border-box; width: 100%; height: 30px; padding: 0 8px; border: 1px solid #dcd7cd; background: #fbfaf7; font: inherit; }
      input[type='text']:focus { outline: none; border-color: #161514; }
      .row { display: flex; gap: 6px; margin-top: 8px; }
      button { height: 30px; padding: 0 12px; border: 1px solid #161514; background: #161514; color: #f4f2ed; font: inherit; cursor: pointer; }
      button.ghost { background: transparent; color: #161514; }
      button:disabled { opacity: 0.5; cursor: default; }
      .sites { display: grid; grid-template-columns: 1fr 1fr; }
      .hint { margin-top: 4px; font-size: 11.5px; color: #5c5750; }
    </style>
  </head>
  <body>
    <header>
      <svg width="20" height="20" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" fill="#161514" /><g fill="#f4f2ed"><rect x="14" y="16" width="9" height="32" /><rect x="27.5" y="25" width="9" height="23" /><rect x="41" y="34" width="9" height="14" /></g></svg>
      <strong>Menswear Index</strong>
    </header>

    <section>
      <h2>Data</h2>
      <div class="status" id="status">Loading…</div>
      <div class="err" id="error" hidden></div>
      <div class="row"><button id="sync" type="button">Sync now</button></div>
    </section>

    <section>
      <h2>Show badges</h2>
      <label><input type="checkbox" id="enabled" /> On all supported sites</label>
      <div class="sites" id="sites"></div>
      <label><input type="checkbox" id="provisional" /> Include provisional brands</label>
      <div class="hint">Provisional brands have too little public information to assess; their scores are placeholders.</div>
    </section>

    <section>
      <h2>Index site</h2>
      <input type="text" id="endpoint" spellcheck="false" />
      <div class="row"><button id="save" class="ghost" type="button">Save</button></div>
      <div class="hint">Where the data syncs from daily and where badges link to.</div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
