<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Menswear Index — Scan results</title>
    <style>
      :root { color-scheme: light; --ink: #161514; --ink2: #3a3834; --muted: #5c5750; --line: #dcd7cd; --line2: #e7e3da; --paper: #f4f2ed; --card: #fbfaf7; --blue: #173c70; --red: #722426; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 13px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--ink); background: var(--paper); }
      button { font: inherit; color: inherit; }
      header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 20px; background: var(--paper); border-bottom: 1px solid var(--line); }
      .brandmark { display: flex; align-items: center; gap: 8px; }
      .brandmark strong { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
      #run { flex: 1; min-width: 220px; }
      #run .q { font-weight: 600; }
      #run .s { color: var(--muted); font-size: 12px; }
      #run .err { color: var(--red); font-size: 12px; }
      .bar { height: 3px; background: var(--line); margin-top: 4px; max-width: 360px; }
      .bar i { display: block; height: 100%; background: var(--blue); transition: width 0.3s; }
      .btn { height: 30px; padding: 0 12px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); cursor: pointer; }
      .btn.ghost { background: transparent; color: var(--ink); }
      .btn:disabled { opacity: 0.5; cursor: default; }
      nav.modes { display: flex; gap: 0; border: 1px solid var(--line); background: var(--card); }
      nav.modes button { all: unset; padding: 6px 12px; cursor: pointer; font-size: 12.5px; color: var(--ink2); }
      nav.modes button[aria-pressed='true'] { background: var(--ink); color: var(--paper); }
      nav.modes button:focus-visible { outline: 2px solid var(--ink); }
      .layout { display: grid; grid-template-columns: 260px 1fr; gap: 0; align-items: start; }
      aside { position: sticky; top: 57px; max-height: calc(100vh - 57px); overflow-y: auto; padding: 14px 16px 24px; border-right: 1px solid var(--line); }
      main { padding: 14px 20px 40px; min-width: 0; }
      h2 { margin: 16px 0 6px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
      aside h2:first-child { margin-top: 0; }
      .head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
      input[type='range'] { width: 100%; accent-color: var(--ink); margin: 2px 0; }
      input[type='text'], input[type='number'], select { width: 100%; height: 30px; padding: 0 8px; border: 1px solid var(--line); background: var(--card); font: inherit; color: inherit; }
      input:focus, select:focus { outline: none; border-color: var(--ink); }
      .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      label.check { display: flex; align-items: center; gap: 8px; padding: 2px 0; cursor: pointer; font-size: 12.5px; }
      .chips { display: flex; flex-wrap: wrap; gap: 4px; }
      .chips button { all: unset; padding: 2px 7px; border: 1px solid var(--line); background: var(--card); font-size: 12px; cursor: pointer; }
      .chips button[aria-pressed='true'] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
      .chips button:focus-visible { outline: 2px solid var(--ink); }
      .chips .n { color: var(--muted); margin-left: 3px; font-size: 11px; }
      .chips button[aria-pressed='true'] .n { color: #c9c4ba; }
      .hint { color: var(--muted); font-size: 11.5px; margin-top: 4px; }
      .link { all: unset; color: var(--blue); cursor: pointer; font-size: 12px; text-decoration: underline; text-underline-offset: 2px; }
      .muted-list { display: flex; flex-direction: column; gap: 2px; font-size: 12px; }
      .muted-list div { display: flex; justify-content: space-between; gap: 6px; }
      .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 12px; }
      .toolbar .count { font-weight: 600; }
      .toolbar .grow { flex: 1; }
      .toolbar select { width: auto; }
      .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 4px 2px 8px; background: var(--ink); color: var(--paper); font-size: 12px; }
      .pill button { all: unset; cursor: pointer; padding: 0 4px; }
      .explain { margin: -4px 0 12px; color: var(--muted); font-size: 12px; max-width: 720px; }
      /* listings */
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
      .card { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); min-width: 0; }
      .card a.main { color: inherit; text-decoration: none; display: block; }
      .card a.main:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
      .ph { aspect-ratio: 3 / 4; background: var(--line2); overflow: hidden; }
      .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .body { padding: 8px 9px 4px; }
      .top { display: flex; align-items: center; gap: 6px; }
      .score { display: inline-flex; justify-content: center; min-width: 38px; padding: 2px 4px; font-weight: 600; font-size: 12px; font-variant-numeric: tabular-nums; }
      .score.none { background: var(--line2); color: var(--muted); }
      .tier { color: var(--muted); font-size: 11.5px; }
      .price { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
      .bname { margin-top: 5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .title { color: var(--ink2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .meta { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .steal { margin-top: 4px; font-size: 11.5px; font-weight: 600; color: var(--blue); }
      .actions { display: flex; gap: 4px; padding: 4px 9px 8px; margin-top: auto; }
      .actions button { all: unset; cursor: pointer; font-size: 11.5px; color: var(--muted); padding: 2px 4px; }
      .actions button:hover, .actions button:focus-visible { color: var(--ink); background: var(--line2); }
      .actions .saved { color: var(--blue); font-weight: 600; }
      .more { display: flex; justify-content: center; margin-top: 18px; }
      /* brands */
      table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); }
      th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line2); font-variant-numeric: tabular-nums; }
      th { font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); background: var(--paper); }
      td.num, th.num { text-align: right; }
      tbody tr { cursor: pointer; }
      tbody tr:hover, tbody tr:focus-visible { background: #f1eee7; outline: none; }
      .empty { padding: 40px 0; color: var(--muted); text-align: center; }
      @media (max-width: 760px) {
        .layout { grid-template-columns: 1fr; }
        aside { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
        header { position: static; padding: 10px 16px; }
        main { padding: 14px 16px 40px; }
        .hide-sm { display: none; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brandmark">
        <svg width="20" height="20" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" fill="#161514" /><g fill="#f4f2ed"><rect x="14" y="16" width="9" height="32" /><rect x="27.5" y="25" width="9" height="23" /><rect x="41" y="34" width="9" height="14" /></g></svg>
        <strong>Menswear Index</strong>
      </div>
      <div id="run"></div>
      <nav class="modes" aria-label="View" id="modes"></nav>
      <button class="btn ghost" id="stop" type="button" hidden>Stop scan</button>
      <button class="btn ghost" id="csv" type="button">Export CSV</button>
    </header>
    <div class="layout">
      <aside id="filters">
        <h2>Filters</h2>
        <div class="head"><span>Minimum score</span><b id="min-value">Off</b></div>
        <input type="range" id="min" min="40" max="85" step="1" value="40" aria-label="Minimum score" />
        <div class="hint">Listings from brands not in the index have no score, so any minimum hides them.</div>

        <h2>Price</h2>
        <div class="pair">
          <input type="number" id="price-min" min="0" step="1" placeholder="Min" aria-label="Minimum price" />
          <input type="number" id="price-max" min="0" step="1" placeholder="Max" aria-label="Maximum price" />
        </div>

        <h2>Search</h2>
        <input type="text" id="q" placeholder="Title or brand" spellcheck="false" />

        <h2>Brands</h2>
        <label class="check"><input type="checkbox" id="rated" /> Only brands in the index</label>
        <label class="check"><input type="checkbox" id="multi" /> Only brands with 3+ listings here</label>

        <h2>Tier</h2>
        <div class="chips" id="tiers"></div>

        <h2>Size</h2>
        <div class="chips" id="sizes"></div>

        <h2>Condition</h2>
        <div class="chips" id="conditions"></div>

        <div id="muted-wrap" hidden>
          <h2>Hidden brands</h2>
          <div class="muted-list" id="muted"></div>
        </div>

        <div style="margin-top: 16px"><button class="link" id="reset" type="button">Reset filters</button></div>
      </aside>
      <main>
        <div class="toolbar">
          <span class="count" id="count"></span>
          <span id="brand-pill"></span>
          <span class="grow"></span>
          <label for="sort" class="hide-sm" style="color: var(--muted)">Sort</label>
          <select id="sort" aria-label="Sort"></select>
        </div>
        <div class="explain" id="explain"></div>
        <div id="view"></div>
      </main>
    </div>
    <script src="results.js"></script>
  </body>
</html>
